name: 'Update schedule'

# ⚠️注意：请不要在 fork 的仓库中添加 `on: schedule` 定时任务（cron）。
# Forks 可能被大量复制并触发定时执行，当前 GitHub Actions 资源使用已接近上限，
# 大量 fork 的定时任务可能导致工作流被禁用。若需要定时执行，请使用其它部署方式。
#
# ⚠️NOTICE: Do NOT add `on: schedule` cron triggers in forked repositories.
# Forks may multiply scheduled runs and GitHub Actions resource usage is near limits.
# Many scheduled workflows from forks can cause workflows to be disabled.
# If scheduled execution is required, use other deployment methods.

on:
  schedule:
    # 每天北京时间 06:00 触发 (UTC 22:00)
    - cron: '0 22 * * *'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  push:
    runs-on: ${{ matrix.operating-system }}
    strategy:
      matrix:
        operating-system: [ 'ubuntu-latest' ]
    steps:
      - name: Set branch name
        id: vars
        run: echo "BRANCH_NAME=${{ github.repository_owner == 'Guovin' && 'gd' || 'master' }}" >> $GITHUB_ENV

      - uses: actions/checkout@v3
        with:
          ref: ${{ env.BRANCH_NAME }}

      - name: Run with setup-python 3.13
        uses: actions/setup-python@v4
        with:
          python-version: '3.13'
          update-environment: true
          cache: 'pipenv'

      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Install pipenv
        run: pip3 install --user pipenv

      - name: Install dependecies
        run: pipenv --python 3.13 && pipenv install --deploy

      - name: Update
        run: pipenv run dev

      - name: Commit and push if changed
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add .
          if ! git diff --staged --quiet; then
            git commit -m "Github Action Auto Updated"
            git push --force
          fi

      - name: Cleanup old workflow runs (keep latest 5)
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          WORKFLOW_NAME="Update schedule"
          CURRENT_RUN_ID=${{ github.run_id }}

          echo "Current run ID: $CURRENT_RUN_ID"
          echo "Fetching runs for workflow: $WORKFLOW_NAME"

          mapfile -t RUNS < <(
            gh run list \
              --workflow "$WORKFLOW_NAME" \
              --limit 100 \
              --json databaseId \
              --jq '.[].databaseId'
          )

          KEEP=5
          TOTAL=${#RUNS[@]}
          echo "Found $TOTAL runs. Keeping latest $KEEP."

          if [ "$TOTAL" -le "$KEEP" ]; then
            echo "Nothing to delete."
            exit 0
          fi

          for ((i = KEEP; i < TOTAL; i++)); do
            RUN_ID="${RUNS[$i]}"
            if [ "$RUN_ID" = "$CURRENT_RUN_ID" ]; then
              echo "Skipping current run ID: $RUN_ID (can't delete itself)"
              continue
            fi
            echo "Deleting run ID: $RUN_ID"
            gh run delete "$RUN_ID" || echo "Failed to delete run $RUN_ID (may be already running)"
          done

          echo "Cleanup completed."
